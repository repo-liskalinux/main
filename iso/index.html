<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index of /iso/</title>
    <style>
        :root {
            --bg: #1a1a24;
            --surface: #252538;
            --text: #e2e8f0;
            --primary: #3b82f6;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #fff;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface);
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: #1e1e2f;
            color: #94a3b8;
        }
        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        a {
            color: var(--primary);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Index of /iso/</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Version</th>
            </tr>
        </thead>
        <tbody>
            <td><strong><a href="/">↵ Go to parent directory</a></strong></td>
            <td></td>
        </tbody>
        <tbody id="repoTableBody">
        </tbody>
    </table>
</div>

<script>
    const tableBody = document.getElementById('repoTableBody');
    let repoData = [];
    async function loadRepo() {
        try {
            const response = await fetch('db.json?v=' + new Date().getTime());
            if (!response.ok) {
                throw new Error(`HTTP Error Status: ${response.status}`);
            }
            const rawData = await response.json();
            console.log("Data berhasil diambil:", rawData);
            if (Array.isArray(rawData)) {
                repoData = rawData;
            } else if (rawData.packages && Array.isArray(rawData.packages)) {
                repoData = rawData.packages;
            } else {
                throw new Error("Unknown JSON format!");
            }
            repoData.sort((a, b) => {
                return a.name.localeCompare(b.name, undefined, {
                    numeric: true,
                    sensitivity: 'base'
                });
            });
            renderTable(repoData);
        } catch (error) {
            console.error('Error detail:', error);
            tableBody.innerHTML = `<tr><td colspan="2" style="text-align:center;color:#ef4444;">Failed to load db.json: ${error.message}</td></tr>`;
        }
    }
    function renderTable(data) {
        tableBody.innerHTML = '';
        if (!data || data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="2" style="text-align:center;">No packages found</td></tr>`;
            return;
        }
        data.forEach(packages => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong><a href="${packages.url || '#'}"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Breezeicons-mimetypes-64-application-x-cd-image.svg" width="18" height="18"> ${packages.name}</a></strong></td>
                <td>${packages.version}</td>
            `;
            tableBody.appendChild(row);
        });
    }
    loadRepo();
</script>
</body>
</html>
