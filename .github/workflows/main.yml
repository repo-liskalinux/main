name: Sync Liska Linux DB

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Sync Script
        run: node sync.js

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "Liska Bot"
          git config --global user.email "bot-liskalinux@gmail.com"
          git add x86_64/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated repository sync [bot]" && git push)
